services:
  web:
    build: .
    ports:
      # Хостовый порт переопределяется через .env (WEB_PORT=...) — на сервере,
      # где 8765 уже занят другим процессом, не трогая этот файл.
      - "${WEB_PORT:-8765}:8765"
    volumes:
      # БД и скачанные PDF сохраняются на хосте между перезапусками
      - ./data:/app/data
      - ./downloads:/app/downloads
    environment:
      # Имя сервиса ocr — DNS внутри сети, которую создаёт compose (см. ниже).
      - OCR_SERVICE_URL=http://ocr:8000
    depends_on:
      - ocr
    restart: unless-stopped

  ocr:
    # Образ — отдельный проект (npa-ocr, своё репо), собирается отдельно, не
    # отсюда: build: ../npa-ocr намеренно не используется — сервис не обязан
    # жить рядом с этим репозиторием (в будущем — свой хост или реестр образов,
    # см. docs/ocr-integration.md).
    #   cd ../npa-ocr && docker build -t npa-ocr .
    image: npa-ocr:latest
    # command: без entrypoint добавился бы к ENTRYPOINT ["npa-ocr"] образа (CLI),
    # а не заменил его — нужно переопределить оба.
    entrypoint: ["uvicorn"]
    command: ["npa_ocr.server:app", "--host", "0.0.0.0", "--port", "8000"]
    # host.docker.internal: доступ к Ollama (эскалация ИИ для текста под печатью/
    # штампом, см. npa-ocr/docs/plan.md) — Ollama крутится в своём отдельном
    # docker-compose проекте на хосте, порт 11434 опубликован на 0.0.0.0, но
    # сервис ocr живёт в другой docker-сети и своего DNS-имени для хоста не
    # имеет. host-gateway — спец-значение Docker (20.10+) для IP хоста из
    # контейнера на Linux; на Docker Desktop (Win/Mac) host.docker.internal
    # резолвится и без этой строки, но явное объявление не мешает.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    restart: unless-stopped
